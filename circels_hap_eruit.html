<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Images Sudoku</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: radial-gradient(circle, #ffefd5 20%, transparent 20%),
                        radial-gradient(circle, #e0ffff 20%, transparent 20%);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            background-color: #f0f8ff;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #ff6347; text-shadow: 1px 1px 2px white; }

        #grid { display: grid; grid-template-columns: repeat(9, 50px); grid-template-rows: repeat(9, 50px); gap: 0; border: 3px solid #333; margin-top: 10px; background: white; }
        .cell { width: 50px; height: 50px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cell img { width: 45px; height: 45px; pointer-events: none; }

        /* 3x3 patroon met roze tint */
        .block-0, .block-2, .block-4, .block-6, .block-8 { background-color: #fadfdf; }
        .block-1, .block-3, .block-5, .block-7 { background-color: #ffffff; }

        .cell:nth-child(3n) { border-right: 3px solid #333; }
        .cell:nth-child(9n) { border-right: 1px solid #999; }
        .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #333; }

        .selected { background-color: #ffd700 !important; }
        .error { background-color: #ee5d5b !important; }

        #popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 5px solid #ff6347; border-radius: 20px; z-index: 1000; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        #popup img { width: 400px; height: 429px; display: block; margin-bottom: 15px; border-radius: 10px; }

        /* De knoppen onderin krijgen exact dezelfde maat als de bordcellen (50px) */
        button {
            width: 50px;
            height: 50px;
            padding: 0;          /* Haalt de interne witruimte weg zodat het plaatje kan vullen */
            margin: 5px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: #87ceeb;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;    /* Zorgt dat het plaatje binnen de afgeronde hoeken blijft */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        button:hover { background: #add8e6; }

        /* Zorgt dat de afbeelding in de knop 100% van de ruimte vult */
        button img {
            width: 100%;
            height: 100%;
            object-fit: cover;   /* Zorgt ervoor dat het plaatje mooi vult zonder te vervormen */
            pointer-events: none;
        }
        
        /* Het vliegende plaatje dat gecentreerd start, vergroot en dan naar het doel beweegt */
/* Het vliegende plaatje */
.flying-img {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    width: 45px;
    height: 45px;
    /* transition zorgt voor de vloeiende beweging zodra top, left of transform veranderen */
    transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(6); /* Start groot in het midden */
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.9);
}

/* Begintoestand in het midden van het scherm (groot) */
.flying-img.start-center {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(3); /* Schaal 3x zo groot in het midden */
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
    border-radius: 5px;
    background: white;
}
    </style>
</head>
<body>
    <h1>Speelse Plaatjes Sudoku!</h1>
    <select id="difficulty">
        <option value="0.7">very easy</option>
        <option value="0.5" selected>easy</option>
        <option value="0.4">normal</option>
        <option value="0.3">difficult</option>
        <option value="0.2">expert</option>
    </select>
    <button onclick="initGame()">New Game</button>

    <div id="grid"></div>

        let board = [], solution = [], initialBoard = [], selected = null;

        function initGame() {
            board = Array(81).fill(0);
            solution = Array(81).fill(0);
            fillBoard(solution);
            let difficulty = parseFloat(document.getElementById("difficulty").value);
            board = solution.map(val => Math.random() < difficulty ? val : 0);
            initialBoard = [...board];
            selected = null;
            document.getElementById("popup").style.display = "none";
            render();
        }

        function getBlockClass(i) {
            return "block-" + (Math.floor(i/27)*3 + Math.floor((i%9)/3));
        }

        function render(errorIndexes = []) {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            board.forEach((val, i) => {
                const cell = document.createElement("div");
                cell.className = "cell " + getBlockClass(i) + (i === selected ? " selected" : "") + (errorIndexes.includes(i) ? " error" : "");
                if (val !== 0) {
                    const img = document.createElement("img");
                    img.src = imgData[val];
                    cell.appendChild(img);
                }
                cell.onclick = () => { if(initialBoard[i] === 0) { selected = i; render(); } };
                grid.appendChild(cell);
            });
        }

        function inputNumber(n) {
    if (selected !== null && initialBoard[selected] === 0) {
        // 1. Zoek de HTML-cel op het bord die momenteel geselecteerd is
        const targetCell = document.querySelector('.cell.selected');
        if (!targetCell) return;

        // Bepaal de exacte schermpositie (X en Y) van de geselecteerde cel
        const rect = targetCell.getBoundingClientRect();

        // 2. Zoek de knop in de onderregel op basis van het getal 'n'
        const btnImg = document.querySelector(`button[onclick="inputNumber(${n})"] img`);

        // Als er geen plaatje wordt gevonden of n is 0 (wissen), direct uitvoeren zonder animatie
        if (!btnImg || n === 0) {
            board[selected] = n;
            render();
            checkWin();
            return;
        }

        // 3. Maak het tijdelijke vliegende plaatje aan
        // Door de CSS klasse '.flying-img' verschijnt deze DIRECT gecentreerd en 3x zo groot
        const flyingImg = document.createElement('img');
        flyingImg.src = btnImg.src;
        flyingImg.className = 'flying-img';
        document.body.appendChild(flyingImg);

        // 4. Laat het plaatje 400ms in het midden zweven.
        // Pas DAARNA veranderen we de positie, zodat de transitie naar de cel start.
        setTimeout(() => {
            // Verplaats naar de exacte positie van de Sudoku-cel
            flyingImg.style.top = `${rect.top + rect.height / 2}px`;
            flyingImg.style.left = `${rect.left + rect.width / 2}px`;

            // Breng de schaal terug naar de normale grootte (1) zodat hij precies in de cel past
            flyingImg.style.transform = 'translate(-50%, -50%) scale(1)';
        }, 400); // Tijd dat het plaatje in het midden blijft 'zweven' (in milliseconden)

        // 5. Zodra de vlucht klaar is (400ms wachten + 600ms CSS transitie = 1000ms),
        // verwijderen we de tijdelijke afbeelding en zetten we hem definitief in het bord.
        setTimeout(() => {
            flyingImg.remove();

            // Voer de originele logica uit
            board[selected] = n;
            render();
            checkWin();
        }, 1000);
    }
}

        function giveHint() {
            if (selected !== null && initialBoard[selected] === 0) {
                board[selected] = solution[selected];
                render();
                checkWin();
            }
        }

        function checkGame() {
            let errors = [];
            board.forEach((val, i) => { if (val !== 0 && val !== solution[i]) errors.push(i); });
            if (errors.length > 0) {
                render(errors);
                alert("Oeps! Some mistakes. see the red bos.");
            } else if (board.includes(0)) {
                alert("So far so good! Go on.");
            }
        }

        function checkWin() {
            if (!board.includes(0)) {
                let isCorrect = board.every((v, i) => v === solution[i]);
                if (isCorrect) {
                    document.getElementById("popup").style.display = "block";
                }
            }
        }

        function fillBoard(b) { for (let i = 0; i < 81; i++) { if (b[i] === 0) { let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5); for (let n of nums) { if (isValid(b, i, n)) { b[i] = n; if (fillBoard(b)) return true; b[i] = 0; } } return false; } } return true; }
        function isValid(b, i, n) { let r = Math.floor(i/9), c = i%9; for(let x=0; x<9; x++) if(b[r*9+x] == n || b[x*9+c] == n) return false; let sr = Math.floor(r/3)*3, sc = Math.floor(c/3)*3; for(let x=0; x<3; x++) for(let y=0; y<3; y++) if(b[(sr+x)*9+(sc+y)] == n) return false; return true; }

        initGame();
    </script>
</body>
</html>
