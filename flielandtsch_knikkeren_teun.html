<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beveiligd Document</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }

        /* Input container voor het oogje */
        .input-container { position: relative; margin: 15px 0; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px 40px 10px 10px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 16px; }

        /* Styling van het oogje (gemaakt met pure CSS/SVG, dus geen externe downloads nodig) */
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; width: 20px; height: 20px; opacity: 0.5; user-select: none; }
        .toggle-password:hover { opacity: 0.8; }

        button.btn-unlock { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: 500; }
        button.btn-unlock:hover { background: #1d4ed8; }
        .error { color: #dc2626; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>Dit bestand is beveiligd</h2>
    <p>Voer het wachtwoord in om de inhoud te bekijken.</p>

    <div class="input-container">
        <input type="password" id="pw" placeholder="Wachtwoord" autofocus>
        <!-- SVG Icoontje voor het oogje -->
        <span class="toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        </span>
    </div>

    <button class="btn-unlock" onclick="unlock()">Ontgrendel</button>
    <div class="error" id="err">Onjuist wachtwoord. Probeer het opnieuw.</div>
</div>

<script>
// Schakelknop voor het tonen/verbergen van het wachtwoord
function togglePasswordVisibility() {
    const pwInput = document.getElementById('pw');
    const eyeIcon = document.getElementById('eyeIcon');

    if (pwInput.type === 'password') {
        pwInput.type = 'text';
        eyeIcon.style.opacity = '1'; // Maak het oogje feller als het wachtwoord zichtbaar is
    } else {
        pwInput.type = 'password';
        eyeIcon.style.opacity = '0.5';
    }
}
