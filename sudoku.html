<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Speelse Sudoku</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: radial-gradient(circle, #ffefd5 20%, transparent 20%),
                        radial-gradient(circle, #e0ffff 20%, transparent 20%);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            background-color: #f0f8ff;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #ff6347; text-shadow: 1px 1px 2px white; }

        #grid { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(9, 40px); gap: 0; border: 3px solid #333; margin-top: 10px; }
        .cell { width: 40px; height: 40px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }

        .block-0, .block-2, .block-4, .block-6, .block-8 { background-color: #fadfdf; }
        .block-1, .block-3, .block-5, .block-7 { background-color: #ffffff; }

        .cell:nth-child(3n) { border-right: 3px solid #333; }
        .cell:nth-child(9n) { border-right: 1px solid #999; }
        .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #333; }

        .selected { background-color: #ffd700 !important; }
        .fixed { color: #000; }
        .user-input { color: #ff0000; }
        .error { background-color: #ffcccb !important; }

        /* Popup stijlen */
        #popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 5px solid #ff6347; border-radius: 20px; z-index: 1000; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        #popup img { width: 400px; height: 429px; display: block; margin-bottom: 15px; border-radius: 10px; }

        button { padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 10px; border: none; background: #87ceeb; font-weight: bold; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        button:hover { background: #add8e6; }
    </style>
</head>
<body>

    <h1>Speelse Sudoku!</h1>
    <select id="difficulty">
        <option value="0.7">Heel makkelijk</option>
        <option value="0.5" selected>Makkelijk</option>
        <option value="0.4">Gemiddeld</option>
        <option value="0.3">Moeilijk</option>
        <option value="0.2">Expert</option>
    </select>
    <button onclick="initGame()">Nieuw Spel</button>

    <div id="grid"></div>

    <div id="numbers">
        <button onclick="inputNumber(1)">1</button> <button onclick="inputNumber(2)">2</button>
        <button onclick="inputNumber(3)">3</button> <button onclick="inputNumber(4)">4</button>
        <button onclick="inputNumber(5)">5</button> <button onclick="inputNumber(6)">6</button>
        <button onclick="inputNumber(7)">7</button> <button onclick="inputNumber(8)">8</button>
        <button onclick="inputNumber(9)">9</button>
        <button onclick="inputNumber(0)" style="background:#ffcccb">Wissen</button>
    </div>

    <div>
        <button onclick="giveHint()" style="background: #90ee90;">Geef Hint</button>
        <button onclick="checkGame()" style="background: #ffa500;">Controleer Fouten</button>
    </div>

        <button onclick="document.getElementById('popup').style.display='none'">Sluiten</button>
    </div>

    <script>
        let board = [], solution = [], initialBoard = [], selected = null;

        function initGame() {
            board = Array(81).fill(0);
            solution = Array(81).fill(0);
            fillBoard(solution);
            let difficulty = parseFloat(document.getElementById('difficulty').value);
            board = solution.map(val => Math.random() < difficulty ? val : 0);
            initialBoard = [...board];
            selected = null;
            document.getElementById('popup').style.display = 'none';
            render();
        }

        function getBlockClass(i) {
            let r = Math.floor(i / 9);
            let c = i % 9;
            let blockIndex = Math.floor(r / 3) * 3 + Math.floor(c / 3);
            return 'block-' + blockIndex;
        }

        function fillBoard(b) {
            for (let i = 0; i < 81; i++) {
                if (b[i] === 0) {
                    let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                    for (let n of nums) {
                        if (isValid(b, i, n)) {
                            b[i] = n;
                            if (fillBoard(b)) return true;
                            b[i] = 0;
                        }
                    }
                    return false;
                }
            }
            return true;
        }

        function isValid(b, i, n) {
            let r = Math.floor(i/9), c = i%9;
            for(let x=0; x<9; x++) if(b[r*9+x] == n || b[x*9+c] == n) return false;
            let sr = Math.floor(r/3)*3, sc = Math.floor(c/3)*3;
            for(let x=0; x<3; x++) for(let y=0; y<3; y++) if(b[(sr+x)*9+(sc+y)] == n) return false;
            return true;
        }

        function render(errorIndexes = []) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            board.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell ' + getBlockClass(i) + (errorIndexes.includes(i) ? ' error' : '');
                if (i === selected) cell.classList.add('selected');

                if (val !== 0) {
                    cell.textContent = val;
                    if (initialBoard[i] !== 0) cell.classList.add('fixed');
                    else cell.classList.add('user-input');
                }

                cell.onclick = () => { if(initialBoard[i] === 0) { selected = i; render(); } };
                grid.appendChild(cell);
            });
        }

        function checkWin() {
            if (!board.includes(0)) {
                let isCorrect = board.every((v, i) => v === solution[i]);
                if (isCorrect) {
                    document.getElementById('popup').style.display = 'block';
                }
            }
        }

        function inputNumber(n) {
            if (selected !== null && initialBoard[selected] === 0) {
                board[selected] = n;
                render();
                checkWin();
            }
        }

        function giveHint() {
            if (selected !== null && initialBoard[selected] === 0) {
                board[selected] = solution[selected];
                render();
                checkWin();
            }
        }

        function checkGame() {
            let errors = [];
            board.forEach((val, i) => { if (val !== 0 && val !== solution[i]) errors.push(i); });
            if (errors.length > 0) {
                render(errors);
                alert("Oeps! Er staan wat foutjes in de roodgekleurde vakjes.");
            } else if (board.includes(0)) {
                alert("Tot nu toe gaat het prima! Vul de rest in.");
            }
        }

        initGame();
    </script>
