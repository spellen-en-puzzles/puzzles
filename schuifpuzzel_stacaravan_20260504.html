<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto Schuifpuzzel</title>
    <style>
        :root {
            --board-w: min(95vw, 600px);
            --cols: 3;
            --aspect: 1.3333333333333;
            --tile-w: calc(var(--board-w) / var(--cols));
            --tile-h: calc(var(--tile-w) / var(--aspect));
        }
        body { 
            font-family: sans-serif; background: #1a1a1a; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; padding: 20px; touch-action: none; 
        }
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--tile-w));
            grid-template-rows: repeat(2, var(--tile-h));
            gap: 2px; background: #222; border: 4px solid #333;
            position: relative;
        }
        .tile { 
            width: var(--tile-w); height: var(--tile-h); 
            cursor: pointer; transition: transform 0.2s;
            user-select: none; position: relative; overflow: hidden;
        }
        .tile img { width: 100%; height: 100%; display: block; pointer-events: none; }
        
        .tile.empty-ghost { 
            opacity: 0.2; 
            filter: grayscale(100%) blur(2px);
            cursor: default;
            z-index: 1;
        }

        /* Hoera melding stijl */
        #hoera-moment {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #hoera-moment h1 { margin: 0; font-size: 3rem; }
        #hoera-moment p { margin: 10px 0 0; font-size: 1.5rem; font-weight: bold; }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>

    <!-- Het Hoera Momentje -->
    <div id="hoera-moment">
        <h1>🥳</h1>
        <p>Goed gedaan</p>
    </div>

    <script>
        const cols = 3;
        let isWon = false;

        function tryMove(tile) {
            if (isWon) return; // Stop interactie als de puzzel al af is

            const emptySlot = document.getElementById('empty-slot');
            if (tile === emptySlot) return;

            const currentPos = parseInt(tile.getAttribute('data-pos'));
            const emptyPos = parseInt(emptySlot.getAttribute('data-pos'));

            const currR = Math.floor(currentPos / cols);
            const currC = currentPos % cols;
            const empR = Math.floor(emptyPos / cols);
            const empC = emptyPos % cols;

            if ((Math.abs(currR - empR) + Math.abs(currC - empC)) === 1) {
                tile.setAttribute('data-pos', emptyPos);
                emptySlot.setAttribute('data-pos', currentPos);

                const board = tile.parentNode;
                const pieces = Array.from(board.children);
                pieces.sort((a, b) => a.getAttribute('data-pos') - b.getAttribute('data-pos'));
                pieces.forEach(p => board.appendChild(p));

                checkWin();
            }
        }

        function checkWin() {
            const tiles = document.querySelectorAll('.tile');
            let correctCount = 0;

            tiles.forEach(tile => {
                // Controleer of de huidige positie gelijk is aan de originele positie
                if (tile.getAttribute('data-pos') == tile.getAttribute('data-origin')) {
                    correctCount++;
                }
            });

            if (correctCount === tiles.length) {
                showWin();
            }
        }

        function showWin() {
            isWon = true;
            const hoera = document.getElementById('hoera-moment');
            hoera.style.display = 'block';

            // Verwijder de vage 'ghost' look voor de winnaar
            document.getElementById('empty-slot').classList.remove('empty-ghost');

            // Na 3 seconden de melding verbergen
            setTimeout(() => {
                hoera.style.opacity = '0';
                hoera.style.transition = 'opacity 1s';
                setTimeout(() => { hoera.style.display = 'none'; }, 1000);
            }, 3000);
        }
    </script>
