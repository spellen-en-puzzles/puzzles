<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mijn Foto Puzzel</title>
    <style>
        :root {
            --max-w: 600px;
            --board-w: min(90vw, var(--max-w));
            --cols: 3;
            --aspect: 1.4362657091562;
            --tile-w: calc(var(--board-w) / var(--cols));
            --tile-h: calc(var(--tile-w) / var(--aspect));
        }
        body { 
            font-family: sans-serif; background: #1a1a1a; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; padding: 10px; overflow-x: hidden; touch-action: none;
        }
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--tile-w));
            grid-template-rows: repeat(3, var(--tile-h));
            width: var(--board-w);
            height: calc(var(--tile-h) * 3);
            background: #222; border: 2px solid #444; margin: 20px 0;
        }
        .slot { width: var(--tile-w); height: var(--tile-h); outline: 1px solid rgba(255,255,255,0.05); position: relative; }
        #inventory {
            display: flex; flex-wrap: wrap; gap: 10px; padding: 20px;
            width: 95vw; max-width: 800px; background: #2a2a2a; border-radius: 12px;
            justify-content: center; min-height: calc(var(--tile-h) + 40px);
        }
        .piece { width: var(--tile-w); height: var(--tile-h); cursor: grab; touch-action: none; position: relative; z-index: 10; }
        .piece img { width: 100%; height: 100%; display: block; pointer-events: none; border-radius: 2px; }
        .piece.dragging { position: fixed !important; z-index: 1000 !important; opacity: 0.8; pointer-events: none; }
    </style>
</head>

    <script>
        let activePiece = null;
        let offset = { x: 0, y: 0 };

        document.addEventListener('mousedown', handleStart);
        document.addEventListener('touchstart', handleStart, { passive: false });

        function handleStart(e) {
            const target = e.target.closest('.piece');
            if (!target) return;
            e.preventDefault();
            activePiece = target;
            const evt = e.touches ? e.touches[0] : e;
            const rect = activePiece.getBoundingClientRect();
            offset.x = evt.clientX - rect.left;
            offset.y = evt.clientY - rect.top;
            activePiece.style.width = rect.width + 'px';
            activePiece.style.height = rect.height + 'px';
            activePiece.classList.add('dragging');
            moveAt(evt.clientX, evt.clientY);
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchend', handleEnd);
        }

        function handleMove(e) {
            if (!activePiece) return;
            const evt = e.touches ? e.touches[0] : e;
            moveAt(evt.clientX, evt.clientY);
        }

        function moveAt(x, y) {
            activePiece.style.left = (x - offset.x) + 'px';
            activePiece.style.top = (y - offset.y) + 'px';
        }

        function handleEnd(e) {
            if (!activePiece) return;
            const rect = activePiece.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            activePiece.classList.remove('dragging');
            activePiece.style.display = 'none';
            let elementBelow = document.elementFromPoint(centerX, centerY);
            activePiece.style.display = 'block';
            let slot = elementBelow ? elementBelow.closest('.slot') : null;

            if (slot && slot.children.length === 0) {
                slot.appendChild(activePiece);
                activePiece.style.position = 'relative';
            } else {
                document.getElementById('inventory').appendChild(activePiece);
                activePiece.style.position = 'relative';
            }
            activePiece.style.left = ''; activePiece.style.top = '';
            activePiece.style.width = ''; activePiece.style.height = '';
            document.removeEventListener('mousemove', handleMove);
            document.removeEventListener('touchmove', handleMove);
            document.removeEventListener('mouseup', handleEnd);
            document.removeEventListener('touchend', handleEnd);
            activePiece = null;
        }
    </script>
