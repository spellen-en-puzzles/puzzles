<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Mens Erger Je Niet - Tablet Versie</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 10px; }
        #header-ui { display: flex; align-items: center; justify-content: center; gap: 25px; background: rgba(40,40,40,0.9); padding: 15px 30px; border-radius: 60px; margin: 0 auto 15px auto; max-width: 650px; border: 2px solid #555; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #status { font-size: 1.5em; font-weight: bold; min-width: 220px; }
        .dice-container { width: 70px; height: 70px; cursor: pointer; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }
        .shaking { animation: shake 0.3s ease-in-out; }
        #dice-img { width: 100%; height: 100%; border-radius: 10px; object-fit: contain; }
        #game-container { position: relative; width: 800px; height: 800px; margin: 0 auto; border: 5px solid #333; border-radius: 10px; }
        #bord { position: absolute; top: 0; left: 0; width: 800px; height: 800px; }
        .pion { position: absolute; width: 36px; height: 36px; border-radius: 50%; border: 3px solid #000; box-shadow: 4px 4px 8px rgba(0,0,0,0.7); transform: translate(-18px, -18px); transition: left 0.4s ease-in-out, top 0.4s ease-in-out; cursor: pointer; z-index: 10; }
        .pion.flying-home { transition: left 0.6s cubic-bezier(0.5, 0, 0.5, 1), top 0.6s cubic-bezier(0.5, 0, 0.5, 1); z-index: 100 !important; }
        #roll-text { color: #aaa; font-style: italic; font-size: 0.9em; }
    </style>
</head>

    const posMapping = {
        start: { rood: [0,1,2,3], blauw: [4,5,6,7], geel: [8,9,10,11], groen: [12,13,14,15] },
        route: Array.from({length: 40}, (_, i) => i + 16),
        home:  { rood: [56,57,58,59], blauw: [60,61,62,63], geel: [64,65,66,67], groen: [68,69,70,71] }
    };

    const entryPoints = { rood: 0, blauw: 10, geel: 20, groen: 30 };
    const exitPoints = { rood: 39, blauw: 9, geel: 19, groen: 29 };

    let game = { turn: 'rood', roll: 0, hasRolled: false, isMoving: false, pionnen: [] };

    ['rood', 'blauw', 'geel', 'groen'].forEach(c => {
        game.pionnen.push({ color: c, posType: 'route', index: entryPoints[c] });
        for(let i=1; i<4; i++) game.pionnen.push({ color: c, posType: 'start', index: i });
    });

    function getCoordIdx(p) {
        if (p.posType === 'start') return posMapping.start[p.color][p.index];
        if (p.posType === 'home') return posMapping.home[p.color][p.index];
        return posMapping.route[p.index];
    }

    function render() {
        const layer = document.getElementById('pionnen-layer');
        layer.innerHTML = '';
        game.pionnen.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'pion';
            div.id = 'pion-' + i;
            div.style.backgroundColor = p.color === 'rood' ? 'red' : p.color === 'blauw' ? 'blue' : p.color === 'geel' ? 'yellow' : 'green';
            let idx = getCoordIdx(p);
            div.style.left = coords[idx].x + 'px';
            div.style.top = coords[idx].y + 'px';
            div.onclick = () => movePion(i);
            layer.appendChild(div);
        });
    }

        const key = val + '_' + color;
        document.getElementById('dice-img').src = diceImages[key];
    }

    function userRoll() {
        if (game.turn === 'rood' && !game.hasRolled && !game.isMoving) rollDice();
    }

    function rollDice() {
        const diceBox = document.getElementById('dice-box');
        diceBox.classList.add('shaking');
        setTimeout(() => {
            diceBox.classList.remove('shaking');
            game.roll = Math.floor(Math.random() * 6) + 1;
            game.hasRolled = true;
            updateDiceImage(game.roll, game.turn);
            document.getElementById('roll-text').innerText = "Gegooid!";
            let options = game.pionnen.filter((p, i) => p.color === game.turn && canMove(i));
            if (options.length === 0) setTimeout(nextTurn, 1500);
            else if (game.turn !== 'rood') setTimeout(() => autoMove(options), 1000);
        }, 450);
    }

    function canMove(i) {
        const p = game.pionnen[i];
        if (p.posType === 'start') return game.roll === 6;
        if (p.posType === 'home') return (p.index + game.roll) <= 3;
        if (p.posType === 'route') {
            let stepsToExit = (exitPoints[p.color] - p.index + 40) % 40;
            if (game.roll > stepsToExit) {
                let overflow = game.roll - stepsToExit - 1;
                if (overflow > 3) return false;
            }
        }
        return true;
    }

    async function movePion(i) {
        if (!game.hasRolled || game.pionnen[i].color !== game.turn || !canMove(i) || game.isMoving) return;
        let p = game.pionnen[i];
        if (game.roll === 6) {
            let heeftHonkPion = game.pionnen.some(x => x.color === game.turn && x.posType === 'start');
            if (heeftHonkPion && p.posType !== 'start') return;
        }
        game.isMoving = true;
        if (p.posType === 'start') {
            p.posType = 'route'; p.index = entryPoints[p.color];
            render(); await new Promise(r => setTimeout(r, 400));
            await checkCapture(i);
        } else {
            let steps = game.roll;
            for(let s=0; s < steps; s++) {
                if (p.posType === 'route') {
                    if (p.index === exitPoints[p.color]) { p.posType = 'home'; p.index = 0; }
                    else { p.index = (p.index + 1) % 40; }
                } else if (p.posType === 'home') { p.index++; }
                render(); await new Promise(r => setTimeout(r, 350));
            }
            await checkCapture(i);
        }
        game.isMoving = false;
        if (game.roll === 6) {
            game.hasRolled = false;
            updateDiceImage(0, game.turn);
            if (game.turn !== 'rood') setTimeout(rollDice, 1500);
        } else { nextTurn(); }
    }

    async function checkCapture(moverIdx) {
        const mover = game.pionnen[moverIdx];
        if (mover.posType !== 'route') return;
        let geslagenIdx = game.pionnen.findIndex((other, i) => i !== moverIdx && other.posType === 'route' && other.index === mover.index);
        if (geslagenIdx !== -1) {
            const geslagenPion = game.pionnen[geslagenIdx];
            const el = document.getElementById('pion-' + geslagenIdx);
            let vrijeH = 0;
            for (let n = 0; n < 4; n++) {
                if (!game.pionnen.some(p => p.color === geslagenPion.color && p.posType === 'start' && p.index === n)) { vrijeH = n; break; }
            }
            el.classList.add('flying-home');
            let hIdx = posMapping.start[geslagenPion.color][vrijeH];
            el.style.left = coords[hIdx].x + 'px'; el.style.top = coords[hIdx].y + 'px';
            geslagenPion.posType = 'start'; geslagenPion.index = vrijeH;
            await new Promise(r => setTimeout(r, 650));
            el.classList.remove('flying-home');
        }
    }

    function nextTurn() {
        const kleuren = ['rood', 'blauw', 'geel', 'groen'];
        game.turn = kleuren[(kleuren.indexOf(game.turn) + 1) % 4];
        game.hasRolled = false;
        const s = document.getElementById('current-player');
        s.innerText = game.turn.charAt(0).toUpperCase() + game.turn.slice(1);
        s.style.color = game.turn === 'rood' ? 'red' : game.turn === 'blauw' ? 'blue' : game.turn === 'geel' ? 'yellow' : 'green';
        updateDiceImage(0, game.turn);
        if (game.turn !== 'rood') setTimeout(rollDice, 1500);
    }

    function autoMove(options) {
        let targetIdx = -1;
        if (game.roll === 6) {
            let h = options.find(p => p.posType === 'start');
            if (h) targetIdx = game.pionnen.indexOf(h);
        }
        if (targetIdx === -1) {
            let onRoute = options.filter(p => p.posType === 'route');
            targetIdx = game.pionnen.indexOf(onRoute.length > 0 ? onRoute[0] : options[0]);
        }
        if (targetIdx !== -1) movePion(targetIdx);
    }

    // Initial setup
    updateDiceImage(0, 'rood');
    render();
</script>
</body>
