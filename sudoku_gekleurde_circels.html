<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Plaatjes Sudoku</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: radial-gradient(circle, #ffefd5 20%, transparent 20%),
                        radial-gradient(circle, #e0ffff 20%, transparent 20%);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            background-color: #f0f8ff;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #ff6347; text-shadow: 1px 1px 2px white; }

        #grid { display: grid; grid-template-columns: repeat(9, 50px); grid-template-rows: repeat(9, 50px); gap: 0; border: 3px solid #333; margin-top: 10px; background: white; }
        .cell { width: 50px; height: 50px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cell img { width: 45px; height: 45px; pointer-events: none; }

        /* 3x3 patroon met roze tint */
        .block-0, .block-2, .block-4, .block-6, .block-8 { background-color: #fadfdf; }
        .block-1, .block-3, .block-5, .block-7 { background-color: #ffffff; }

        .cell:nth-child(3n) { border-right: 3px solid #333; }
        .cell:nth-child(9n) { border-right: 1px solid #999; }
        .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #333; }

        .selected { background-color: #ffd700 !important; }
        .error { background-color: #ee5d5b !important; }

        #popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 5px solid #ff6347; border-radius: 20px; z-index: 1000; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        #popup img { width: 400px; height: 429px; display: block; margin-bottom: 15px; border-radius: 10px; }

        button { padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 10px; border: none; background: #87ceeb; font-weight: bold; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        button:hover { background: #add8e6; }
    </style>
</head>

        <option value="0.4">Gemiddeld</option>
        <option value="0.3">Moeilijk</option>
        <option value="0.2">Expert</option>

        let board = [], solution = [], initialBoard = [], selected = null;

        function initGame() {
            board = Array(81).fill(0);
            solution = Array(81).fill(0);
            fillBoard(solution);
            let difficulty = parseFloat(document.getElementById("difficulty").value);
            board = solution.map(val => Math.random() < difficulty ? val : 0);
            initialBoard = [...board];
            selected = null;
            document.getElementById("popup").style.display = "none";
            render();
        }

        function getBlockClass(i) {
            return "block-" + (Math.floor(i/27)*3 + Math.floor((i%9)/3));
        }

        function render(errorIndexes = []) {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            board.forEach((val, i) => {
                const cell = document.createElement("div");
                cell.className = "cell " + getBlockClass(i) + (i === selected ? " selected" : "") + (errorIndexes.includes(i) ? " error" : "");
                if (val !== 0) {
                    const img = document.createElement("img");
                    img.src = imgData[val];
                    cell.appendChild(img);
                }
                cell.onclick = () => { if(initialBoard[i] === 0) { selected = i; render(); } };
                grid.appendChild(cell);
            });
        }

        function inputNumber(n) {
            if (selected !== null && initialBoard[selected] === 0) {
                board[selected] = n;
                render();
                checkWin();
            }
        }

        function giveHint() {
            if (selected !== null && initialBoard[selected] === 0) {
                board[selected] = solution[selected];
                render();
                checkWin();
            }
        }

        function checkGame() {
            let errors = [];
            board.forEach((val, i) => { if (val !== 0 && val !== solution[i]) errors.push(i); });
            if (errors.length > 0) {
                render(errors);
                alert("Oeps! Er staan wat foutjes in de roodgekleurde vakjes.");
            } else if (board.includes(0)) {
                alert("Tot nu toe gaat het prima! Vul de rest in.");
            }
        }

        function checkWin() {
            if (!board.includes(0)) {
                let isCorrect = board.every((v, i) => v === solution[i]);
                if (isCorrect) {
                    document.getElementById("popup").style.display = "block";
                }
            }
        }

        function fillBoard(b) { for (let i = 0; i < 81; i++) { if (b[i] === 0) { let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5); for (let n of nums) { if (isValid(b, i, n)) { b[i] = n; if (fillBoard(b)) return true; b[i] = 0; } } return false; } } return true; }
        function isValid(b, i, n) { let r = Math.floor(i/9), c = i%9; for(let x=0; x<9; x++) if(b[r*9+x] == n || b[x*9+c] == n) return false; let sr = Math.floor(r/3)*3, sc = Math.floor(c/3)*3; for(let x=0; x<3; x++) for(let y=0; y<3; y++) if(b[(sr+x)*9+(sc+y)] == n) return false; return true; }

        initGame();
    </script>
